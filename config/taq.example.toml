# Beispielkonfiguration für tradingagents_quant.
#
# Kopieren nach  %LOCALAPPDATA%\tradingagents-quant\taq.toml  (oder TAQ_CONFIG
# auf eine eigene Datei zeigen lassen). Jeder Wert lässt sich zusätzlich mit
# TAQ_<ABSCHNITT>_<FELD> überschreiben, z. B. TAQ_UNIVERSE_BENCHMARK=QQQ.
#
# Diese Datei enthält nie Zugangsdaten. LLM-Schlüssel (GOOGLE_API_KEY) liest
# die Agentenschicht direkt aus der Umgebung.

[modes]
research_mode = true
backtesting_mode = true
paper_trading_mode = true
# live_trading_mode und live_order_execution sind Konstanten. Jeder andere
# Wert als false bzw. "disabled" bricht den Start ab.

[universe]
name = "us-core"
# Breite, Sektor- und defensive ETFs mit Historie ab 1998-2004. Einzelaktien,
# die man heute kennt, sind bekannt, weil sie überlebt haben (Survivorship Bias).
symbols = ["SPY", "QQQ", "IWM", "DIA", "TLT", "IEF", "GLD",
           "XLB", "XLE", "XLF", "XLI", "XLK", "XLP", "XLU", "XLV", "XLY"]
benchmark = "SPY"
# Handelstage = die Tage, an denen dieses Symbol einen Bar hat.
calendar_symbol = "SPY"
currency = "USD"

[data]
history_start = "1999-01-01"
max_stale_days = 10
# Unter so vielen Bars werden keine annualisierten Kennzahlen ausgewiesen.
min_annualization_bars = 252

[costs]
# Kosten einer simulierten Ausführung. Standard: liquider US-ETF über einen
# Broker mit Gebühr pro Aktie. Bewusst nicht optimistisch.
commission_per_share = 0.005
commission_min = 1.0
commission_max_pct = 0.01
commission_bps = 0.0
spread_bps = 2.0          # ganzer Spread; jede Ausführung zahlt die Hälfte
slippage_bps = 2.0        # zusätzliche ungünstige Bewegung je Ausführung
fractional_shares = false

[backtest]
initial_cash = 100000.0   # simuliertes Kapital, kein echtes Geld
risk_free_rate = 0.0      # jährlich, für Sharpe und Sortino
rebalance_band = 0.2      # Position erst anpassen, wenn sie um mehr als 20 % vom Ziel abweicht

[risk]
# Grenzen der deterministischen Risiko-Engine für jede simulierte Order.
# Nur hier änderbar — kein Lauf, keine Strategie, kein Agent kann sie
# zur Laufzeit verschieben.
max_gross_exposure = 1.0         # alle Positionen zusammen / Kapital
max_position_weight = 0.35       # eine Position / Kapital
max_open_positions = 20
max_drawdown = 0.25              # ab diesem Rückgang vom Höchststand keine neuen Einstiege
max_daily_loss = 0.04            # nach einem solchen Tagesverlust am nächsten Tag keine Einstiege
max_volatility = 0.80            # annualisierte 20-Tage-Volatilität des Instruments
min_dollar_volume = 5000000.0    # durchschnittlicher Tagesumsatz (20 Tage) in USD
max_adv_fraction = 0.01          # Order höchstens 1 % des durchschnittlichen Tagesumsatzes
max_correlated_weight = 0.70     # Gewicht stark korrelierter Positionen zusammen
correlation_threshold = 0.90     # ab dieser 60-Tage-Korrelation gelten Positionen als korreliert
correlation_window = 60
require_stop = false             # true: Einstieg ohne Stop wird abgewiesen
max_risk_per_trade = 0.02        # Verlust bis zum Stop / Kapital
